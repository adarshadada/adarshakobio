name: Unzip site

on:
  push:
    paths:
      - "np_been_site.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unzip into repo root
        run: |
          if [ ! -f np_been_site.zip ]; then
            echo "np_been_site.zip not found, nothing to do."
            exit 0
          fi
          rm -rf /tmp/unz
          mkdir /tmp/unz
          unzip -q np_been_site.zip -d /tmp/unz
          # The zip holds a single "site" folder; copy its contents to the repo root
          cp -a /tmp/unz/site/. .
          rm np_been_site.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unzip site files"
            git push
          fi
